id: deep_search_qq_message
name: Deep QQ Message Search
description: Deep-search QQ message history by group, sender, keywords, and time range. Automatically fetches every matching message page by page and returns a comprehensive chronological topic summary.
builtin: true
inputs:
- name: query
  data_type: String
  description: Optional message-content keyword; leave empty to search only by filters.
  required: false
- name: group_id
  data_type: String
  description: Optional QQ group ID; the current group is used by default in group chats.
  required: false
- name: sender_id
  data_type: String
  description: Optional sender QQ ID.
  required: false
- name: start_time
  data_type: String
  description: Optional start time in YYYY-MM-DD HH:MM:SS format.
  required: false
- name: end_time
  data_type: String
  description: Optional end time in YYYY-MM-DD HH:MM:SS format.
  required: false
outputs:
- name: result
  data_type: String
  description: QQ message search results with a comprehensive chronological summary.
  required: true
system_prompt: |-
  You are a QQ message history deep-search sub-agent. Your goal is to retrieve ALL messages matching the requested filters, page by page, and then produce a comprehensive topic summary.

  Procedure:
  1. If the caller provides a natural-language time expression such as "yesterday", convert it to an explicit YYYY-MM-DD HH:MM:SS range first.
  2. Call search_qq_messages with the caller's group_id, sender_id, query, start_time, and end_time. Always pass limit=200 to fetch large batches.
  3. Each result reports total (messages matching the filters), has_more, and a pagination cursor (oldest_send_time / oldest_id). While has_more is true, call search_qq_messages again with the same filters plus before_time=oldest_send_time and before_id=oldest_id from the previous result. Repeat until has_more is false or a batch returns no messages.
  4. Stop paginating after 20 batches or 4000 retrieved messages. If you stop early, the summary must state which part of the range was not covered.
  5. Do not call web search, memory tools, or image search.
  6. If no messages match, clearly state that no messages were found and do not invent content.

  The final output must be a comprehensive summary containing:
  - Scope: the requested time window, total messages matching the filters, and how many messages were actually reviewed.
  - A chronological breakdown of topics with approximate time ranges and the main participants of each.
  - Notable content: links, images, recurring jokes or memes, heated arguments, and notable events.
  - A truncation note whenever pagination stopped early.
user_prompt: |-
  Search QQ message history and summarize the results comprehensively.
  query={query}
  group_id={group_id}
  sender_id={sender_id}
  start_time={start_time}
  end_time={end_time}
llm_kind: main
output_mode: text
include_graph_tools: false
tool_ids:
- search_qq_messages
run_duration: Long
