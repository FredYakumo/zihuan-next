[package]
name = "zihuan_core"
version = "0.1.0"
edition = "2021"

[features]
default = []
candle-cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
candle-metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[dependencies]
thiserror = "2.0.17"
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12.25", features = ["blocking", "json", "stream"] }
http = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
log = "0.4"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "mysql", "sqlite", "any", "chrono"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
node_macros = { path = "../node_macros" }
general_wheel_cpp = { path = "../general_wheel_cpp" }
async-recursion = "1"
futures-util = "0.3"
once_cell = "1.20"
lazy_static = "1.4"
base64 = "0.22"
aws-config = "1"
aws-sdk-s3 = "1"
aws-credential-types = "1"
aws-types = "1"
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
tokenizers = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
percent-encoding = "2.3"
