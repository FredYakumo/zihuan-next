edition = "2021"
style_edition = "2021"

# Keep formatting independent of terminal size and operating system.
max_width = 100
newline_style = "Unix"
hard_tabs = false
tab_spaces = 4

# Use explicit width limits instead of context-sensitive small-item heuristics.
use_small_heuristics = "Off"
fn_call_width = 80
attr_fn_like_width = 80
struct_lit_width = 40
struct_variant_width = 40
array_width = 80
chain_width = 80
single_line_if_else_max_width = 50
single_line_let_else_max_width = 50
fn_params_layout = "Tall"
