[package]
name = "zihuan_workspace_service"
version = "0.1.0"
edition = "2021"

[dependencies]
zihuan_core = { path = "../zihuan_core" }
salvo = { version = "0.75", features = ["websocket", "affix-state"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
regex = "1"
log = "0.4"
similar = "2"
