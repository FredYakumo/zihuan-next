name: Build

permissions:
  contents: read

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-release-tag:
    name: Validate release tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag commit
        shell: bash
        run: |
          git fetch origin master --no-tags
          source_ref="origin/master"

          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$source_ref"; then
            echo "Tag $GITHUB_REF_NAME does not point to a commit on $source_ref."
            exit 1
          fi

  build-release:
    needs: validate-release-tag
    if: >-
      always() &&
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) &&
      (needs.validate-release-tag.result == 'success' || needs.validate-release-tag.result == 'skipped')
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      CUDA_COMPUTE_CAP: ${{ matrix.cuda_compute_cap }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x86_64-cpu
            runner: windows-2022
            artifact_name: Windows-x86_64-cpu
            binary_extension: .exe
            package_extension: .zip
            build_command: cargo build --release -p zihuan_service --bin zihuan_next
          - name: Linux-x86_64-cpu
            runner: ubuntu-22.04
            artifact_name: Linux-x86_64-cpu
            binary_extension: ''
            package_extension: .tar.xz
            build_command: cargo build --release -p zihuan_service --bin zihuan_next
          - name: macOS-Apple-cpu
            runner: macos-14
            artifact_name: macOS-Apple-cpu
            binary_extension: ''
            package_extension: .zip
            build_command: cargo build --release -p zihuan_service --bin zihuan_next
          - name: Windows-x86_64-candle-cuda-12.6
            runner: windows-2022
            artifact_name: Windows-x86_64-candle-cuda-12.6
            binary_extension: .exe
            package_extension: .zip
            cuda: true
            windows_cuda: true
            cuda_compute_cap: 75
          - name: Linux-x86_64-candle-cuda-12.6
            runner: ubuntu-22.04
            artifact_name: Linux-x86_64-candle-cuda-12.6
            binary_extension: ''
            package_extension: .tar.xz
            cuda: true
            cuda_compute_cap: 75
            build_command: cargo build --release -p zihuan_service --bin zihuan_next --features candle-cuda

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install webui dependencies
        working-directory: webui
        run: pnpm install --frozen-lockfile

      - name: Build webui
        working-directory: webui
        run: pnpm run build

      - name: Set up MSVC environment
        if: matrix.windows_cuda
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up CUDA Toolkit 12.6
        if: matrix.cuda
        uses: Jimver/cuda-toolkit@v0.2.22
        with:
          cuda: 12.6.0

      - name: Build CUDA binary on Windows
        if: matrix.windows_cuda
        shell: pwsh
        run: .\scripts\cargo-cuda.ps1 -Release

      - name: Build binary
        if: "!matrix.windows_cuda"
        run: ${{ matrix.build_command }}

      - name: Prepare release package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageRoot = "package/zihuan_next"
          $archive = "zihuan_next-${{ github.ref_name }}-${{ matrix.artifact_name }}.zip"
          New-Item -ItemType Directory -Force -Path "$packageRoot/dag_nodes", "$packageRoot/dynamic_script_engine" | Out-Null
          Copy-Item "target/release/zihuan_next${{ matrix.binary_extension }}" $packageRoot
          Copy-Item "package.json" $packageRoot
          Copy-Item "dag_nodes/*" "$packageRoot/dag_nodes" -Recurse
          $runtimeFiles = @("engine.mjs", "python_node_runtime.py", "zihuan_sdk.mjs", "zihuan_sdk.py")
          foreach ($file in $runtimeFiles) {
            Copy-Item "dynamic_script_engine/$file" "$packageRoot/dynamic_script_engine"
          }
          Compress-Archive -Path $packageRoot -DestinationPath $archive -Force

      - name: Prepare release package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package_root="package/zihuan_next"
          archive_base="zihuan_next-${{ github.ref_name }}-${{ matrix.artifact_name }}"
          mkdir -p "$package_root/dag_nodes" "$package_root/dynamic_script_engine"
          cp "target/release/zihuan_next${{ matrix.binary_extension }}" "$package_root/"
          cp package.json "$package_root/"
          cp -R dag_nodes/. "$package_root/dag_nodes/"
          cp dynamic_script_engine/{engine.mjs,python_node_runtime.py,zihuan_sdk.mjs,zihuan_sdk.py} "$package_root/dynamic_script_engine/"
          if [[ "${{ matrix.package_extension }}" == ".tar.xz" ]]; then
            tar -cJf "${archive_base}.tar.xz" -C package zihuan_next
          else
            (cd package && zip -r "../${archive_base}.zip" zihuan_next)
          fi

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: zihuan_next-${{ github.ref_name }}-${{ matrix.artifact_name }}${{ matrix.package_extension }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir release
          cp artifacts/Windows-x86_64-cpu/zihuan_next-${{ github.ref_name }}-Windows-x86_64-cpu.zip release/
          cp artifacts/Linux-x86_64-cpu/zihuan_next-${{ github.ref_name }}-Linux-x86_64-cpu.tar.xz release/
          cp artifacts/macOS-Apple-cpu/zihuan_next-${{ github.ref_name }}-macOS-Apple-cpu.zip release/
          cp artifacts/Windows-x86_64-candle-cuda-12.6/zihuan_next-${{ github.ref_name }}-Windows-x86_64-candle-cuda-12.6.zip release/
          cp artifacts/Linux-x86_64-candle-cuda-12.6/zihuan_next-${{ github.ref_name }}-Linux-x86_64-candle-cuda-12.6.tar.xz release/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: release/*
