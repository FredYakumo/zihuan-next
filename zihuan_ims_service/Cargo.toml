[package]
name = "zihuan_ims_service"
version = "0.1.0"
edition = "2021"

[dependencies]
zihuan_core = { path = "../zihuan_core" }
general_wheel_cpp = { path = "../general_wheel_cpp" }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "mysql", "sqlite", "chrono"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12.25", features = ["blocking", "json", "stream"] }
rand = "0.8"
regex = "1"
base64 = "0.22"
async-trait = "0.1"
