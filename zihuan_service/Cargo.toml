[package]
name = "zihuan_service"
version = "0.1.0"
edition = "2021"

[features]
default = []
candle-cuda = ["zihuan_core/candle-cuda"]
candle-metal = ["zihuan_core/candle-metal"]

[[bin]]
name = "zihuan_next"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "mysql", "sqlite", "chrono"] }
salvo = { version = "0.75", features = ["websocket", "affix-state", "serve-static"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

zihuan_core = { path = "../zihuan_core" }
zihuan_workspace_agent = { path = "../zihuan_workspace_agent" }
zihuan_ims_agent = { path = "../zihuan_ims_agent" }
general_wheel_cpp = { path = "../general_wheel_cpp" }
base64 = "0.22"
reqwest = { version = "0.12.25", features = ["blocking", "json", "stream"] }
rand = "0.8"
regex = "1"
clap = { version = "4.5", features = ["derive", "env"] }
log_util = { git = "https://github.com/FredYakumo/LogUtil" }
lazy_static = "1.4"
futures-util = "0.3"
http = "1.0"
once_cell = "1.20"
rust-embed = { version = "8", features = ["debug-embed"] }
sysinfo = "0.33"
thiserror = "2.0.17"
tinyfiledialogs = "3.9"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
zip = { version = "2", features = ["deflate"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
