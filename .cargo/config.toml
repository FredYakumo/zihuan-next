# The MSVC front end (cl.exe / c1.dll) stores a per-invocation debug record in
# the process TEMP directory. Shells that run inside a sandbox only allow child
# processes to write inside the workspace, so a system-wide TEMP makes every C
# build script (ring, aws-lc-sys, esaxx-rs, ...) die with
# `cl: 命令行 error D8050 :未能将命令行放入调试记录中` and the compiler prints no
# diagnostics of its own. Redirect TEMP/TMP into the git-ignored target
# directory so C compilation works in sandboxed shells as well.
[env]
TEMP = { value = "target", relative = true, force = true }
TMP = { value = "target", relative = true, force = true }
