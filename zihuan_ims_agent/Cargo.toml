[package]
name = "zihuan_ims_agent"
version = "0.1.0"
edition = "2021"

[dependencies]
zihuan_core = { path = "../zihuan_core" }
zihuan_workspace_agent = { path = "../zihuan_workspace_agent" }
general_wheel_cpp = { path = "../general_wheel_cpp" }

tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
async-recursion = "1"
log = "0.4"
futures-util = "0.3"
http = "1.0"
once_cell = "1.20"
reqwest = { version = "0.12.25", features = ["blocking", "json"] }
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "mysql", "sqlite", "any", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
percent-encoding = "2.3"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
